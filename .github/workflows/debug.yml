name: Alpine Manual Bore Tunnel
on: workflow_dispatch

jobs:
  tunnel-job:
    runs-on: ubuntu-latest
    container:
      image: alpine:latest
    steps:
      - name: Install and Run Bore
        run: |
          # 1. Обновляем пакеты и ставим утилиты
          apk update && apk add --no-cache curl openssh-server bash
          
          # 2. Настраиваем SSH-сервер
          ssh-keygen -A
          echo "root:password123" | chpasswd
          echo "PermitRootLogin yes" >> /etc/ssh/sshd_config
          /usr/sbin/sshd
          
          # 3. Качаем Bore с фиксированным именем файла
          curl -L -o bore.tar.gz https://github.com/ekzhang/bore/releases/download/v0.6.0/bore-v0.6.0-x86_64-unknown-linux-musl.tar.gz
          tar -xzf bore.tar.gz
          chmod +x bore
          
          # 4. Запускаем туннель в фоне
          ./bore local 22 --to bore.pub &
          
          # 5. Держим раннер активным ровно 6 часов (21600 секунд)
          echo "Туннель запущен. Контейнер будет активен 6 часов..."
          sleep 21600
