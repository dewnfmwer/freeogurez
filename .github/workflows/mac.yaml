name: Live macOS VNC (bore.pub)

on:
  workflow_dispatch:

jobs:
  vnc-session:
    runs-on: macos-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Настраиваем VNC-доступ
        run: |
          KS=/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart

          # запасной способ входа: логин runner + пароль (если legacy-пароль не сработает)
          sudo dscl . -passwd /Users/runner VncPass123 || true

          sudo "$KS" -configure -allowAccessFor -allUsers -privs -all
          sudo "$KS" -configure -clientopts -setvnclegacy -vnclegacy yes
          sudo "$KS" -configure -clientopts -setvncpw -vncpw vncpass1
          sudo "$KS" -activate

      - name: Принудительно запускаем демона Screen Sharing (порт 5900)
        run: |
          sudo launchctl enable system/com.apple.screensharing
          sudo launchctl bootstrap system /System/Library/LaunchDaemons/com.apple.screensharing.plist 2>/dev/null || true
          sudo launchctl kickstart -k system/com.apple.screensharing || true
          sleep 5

      - name: Ждём и проверяем порт 5900
        run: |
          ok=0
          for i in $(seq 1 30); do
            if lsof -nP -iTCP:5900 -sTCP:LISTEN | grep -q LISTEN; then ok=1; break; fi
            sleep 2
          done
          if [ $ok -eq 0 ]; then
            echo "!!! 5900 не поднялся, диагностика:"
            sudo launchctl list | grep -iE 'screen|ARD' || true
            sudo launchctl print system/com.apple.screensharing || true
            exit 1
          fi
          echo "VNC слушает 5900 ✔"

      - name: Ставим bore
        run: |
          brew install bore
          bore --version

      - name: Поднимаем туннель на bore.pub
        run: |
          nohup bore local 5900 --to bore.pub > /tmp/bore.log 2>&1 &

          PORT=""
          for i in $(seq 1 60); do
            PORT=$(grep -oE 'bore\.pub:[0-9]+' /tmp/bore.log | head -1 | cut -d: -f2)
            [ -n "$PORT" ] && break
            sleep 1
          done

          [ -z "$PORT" ] && { echo "!!! bore не выдал порт:"; cat /tmp/bore.log; exit 1; }
          echo "VNC_PORT=$PORT" >> "$GITHUB_ENV"

          echo "========================================================"
          echo "  VNC адрес : bore.pub:$PORT"
          echo "  пароль    : vncpass1 (или логин runner / VncPass123)"
          echo "========================================================"

      - name: Держим сессию живой
        run: |
          nohup caffeinate -disu >/dev/null 2>&1 &
          while true; do
            sleep 300
            echo "[$(date -u '+%H:%M')] alive: bore.pub:${VNC_PORT}"
          done
